<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iFlyProof · 转写校对工作台</title>
<style>
  :root{
    --bg:#f4f1ea; --panel:#fffdf8; --ink:#2c2a26; --muted:#8b8377;
    --accent:#b23a2e; --accent-soft:#f8e9e5; --line:#e6dfd2; --spk:#8d7a63;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);height:100vh;overflow:hidden;}
  .hidden{display:none !important;}

  /* ---------- 首页 ---------- */
  #landing{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#f4f1ea;z-index:100;overflow:auto;padding:24px;}
  .landing-glow{position:absolute;inset:0;pointer-events:none;background:
    radial-gradient(640px 320px at 50% -10%, rgba(178,58,46,.10), transparent 70%),
    radial-gradient(520px 300px at 85% 110%, rgba(141,122,99,.10), transparent 70%);}
  .landing-card{position:relative;width:min(560px,100%);background:#fffdf8;border:1px solid var(--line);border-radius:22px;box-shadow:0 20px 60px rgba(80,60,40,.12);padding:34px 34px 26px;}
  .logo-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:22px;}
  .logo-mark{width:84px;height:84px;border-radius:22px;background:linear-gradient(145deg,#b23a2e,#8f2c22);display:flex;align-items:center;justify-content:center;box-shadow:0 12px 28px rgba(178,58,46,.28);flex:0 0 auto;}
  .logo-mark svg{width:50px;height:50px;}
  .brand-block{display:flex;flex-direction:column;align-items:center;}
  .brand{font-size:20px;font-weight:800;letter-spacing:1px;color:#3a332b;line-height:1.1;}
  .brand-sub{font-size:11px;color:var(--muted);letter-spacing:2px;margin-top:3px;}
  .landing-title{font-size:16px;font-weight:600;color:#4a4238;margin:0 0 16px;line-height:1.5;}
  .paste-box{display:flex;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:7px 7px 7px 16px;transition:border-color .15s,box-shadow .15s;}
  .paste-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(178,58,46,.1);}
  .paste-box input{flex:1 1 auto;border:none;outline:none;font-size:14px;font-family:inherit;background:transparent;color:var(--ink);min-width:0;}
  .paste-box input::placeholder{color:#b7ac9d;}
  .plus{border:1px solid var(--line);background:#fbf8f1;color:#6b5c48;font-size:14px;line-height:1;border-radius:8px;padding:6px 9px;cursor:pointer;font-family:inherit;}
  .plus:disabled{opacity:.4;cursor:default;}
  .plus:hover{background:#f1e9dd;color:var(--accent);}
  .extra-row{display:flex;gap:8px;margin-top:8px;}
  .extra-row input{flex:1 1 auto;min-width:0;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;font-family:inherit;background:#fff;}
  .extra-row .del{border:1px solid var(--line);background:#fffdf8;color:#a06a5a;border-radius:9px;padding:0 12px;cursor:pointer;font-size:16px;}
  #parseBtn{border:none;background:var(--accent);color:#fff;font-family:inherit;font-size:14px;font-weight:600;padding:10px 18px;border-radius:10px;cursor:pointer;white-space:nowrap;}
  #parseBtn:hover{filter:brightness(1.08);}
  #parseBtn:disabled{opacity:.5;cursor:default;}
  .msg{min-height:20px;margin:10px 2px 0;font-size:12.5px;color:var(--muted);}
  .msg.err{color:var(--accent);}
  .landing-links{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:10px;margin-top:16px;}
  #continueRow{display:contents;}
  .link-btn{width:100%;border:1px solid var(--line);border-radius:10px;background:#fbf8f1;color:#6b5c48;font-family:inherit;font-size:12.5px;cursor:pointer;padding:9px 8px;text-align:center;white-space:nowrap;}
  .link-btn:hover{background:#f1e9dd;color:var(--accent);border-color:#e6bcb3;}
  .hist-panel{margin-top:10px;max-height:220px;overflow:auto;background:#fbf8f1;border:1px solid var(--line);border-radius:12px;padding:6px;}
  .hist-panel.hidden{display:none;}
  .hist-item{padding:8px 10px;border-radius:8px;cursor:pointer;font-size:12.5px;color:#4a443b;display:flex;flex-direction:column;gap:3px;}
  .hist-item:hover{background:#f1e9dd;}
  .hist-item small{color:var(--muted);font-size:10.5px;}
  .landing-foot{margin-top:20px;padding-top:14px;border-top:1px dashed var(--line);font-size:11px;color:#b0a595;text-align:center;}

  /* ---------- 编辑界面 ---------- */
  #editor{display:flex;height:100vh;overflow:hidden;}
  .col{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;height:100%;}
  aside{flex:0 0 262px;width:262px;border-left:1px solid var(--line);background:#fbf8f1;display:flex;flex-direction:column;gap:8px;padding:12px 12px 10px;height:100%;overflow:hidden;}
  header{flex:0 0 auto;padding:12px 22px 8px;background:linear-gradient(180deg,#fffdf8,#f8f4ea);border-bottom:1px solid var(--line);}
  .head-row{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;}
  h1.doc{margin:0;font-size:16px;font-weight:800;letter-spacing:.3px;}
  .doc-sub{font-size:11.5px;color:var(--muted);margin-top:4px;}
  .tools{display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:flex-end;}
  .ghost{font-size:12px;color:#6b5c48;background:#fffdf8;border:1px solid var(--line);border-radius:6px;padding:5px 9px;cursor:pointer;font-family:inherit;white-space:nowrap;}
  .ghost:hover{background:#f3ece0;}
  .ghost.armed{background:var(--accent);color:#fff;border-color:var(--accent);}
  #splitHint{display:none;font-size:11.5px;color:var(--accent);margin-top:6px;}
  #splitHint.show{display:block;}
  main{flex:1 1 auto;overflow-y:auto;padding:14px 22px 26px;}
  .entry{display:flex;gap:10px;padding:8px 10px;border-radius:7px;cursor:pointer;border:1px solid transparent;transition:background .12s,border-color .12s;}
  .entry:hover{background:#efe8db;}
  .entry.active{background:var(--accent-soft);border-color:#e6bcb3;}
  .entry.selected{background:#f3ded8;border-color:#d59b8f;box-shadow:inset 3px 0 0 var(--accent);}
  .entry.edited{box-shadow:inset 3px 0 0 #e6bcb3;}
  .entry .time{flex:0 0 62px;font-size:12px;color:var(--accent);padding-top:2px;font-family:ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;}
  .entry .spk{flex:0 0 auto;align-self:flex-start;font-size:11.5px;color:#fff;background:var(--spk);border-radius:3px;padding:1px 7px;margin-top:1px;white-space:nowrap;cursor:pointer;}
  .entry .txt{flex:1 1 auto;font-family:"Songti SC","SimSun","Noto Serif SC",serif;font-size:15px;line-height:1.78;word-break:break-word;}
  .entry .txt.editing{outline:2px solid var(--accent);outline-offset:2px;background:#fff;border-radius:3px;cursor:text;}
  .entry .edit{flex:0 0 auto;border:none;background:transparent;color:#b3a184;cursor:pointer;font-size:13px;padding:2px 5px;opacity:0;border-radius:4px;font-family:inherit;}
  .entry:hover .edit{opacity:1;}
  .entry .edit:hover{color:var(--accent);background:#f3ece0;}
  .spk-inline{flex:0 0 auto;font-family:inherit;font-size:11.5px;width:86px;border:1px solid var(--accent);border-radius:3px;padding:1px 5px;background:#fff;color:var(--ink);}
  .spk-inline:focus{outline:none;}

  footer{flex:0 0 auto;border-top:1px solid var(--line);background:#fffdf8;padding:9px 22px 12px;}
  .now{font-family:"Songti SC","SimSun",serif;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:6px;min-height:18px;}
  .controls{display:flex;align-items:center;gap:12px;}
  #playBtn{width:38px;height:38px;border-radius:50%;border:none;background:var(--accent);color:#fff;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  #playBtn:hover{filter:brightness(1.08);}
  .skip{flex:0 0 auto;border:1px solid var(--line);background:#fffdf8;color:#6b5c48;border-radius:18px;padding:6px 10px;font-size:12px;cursor:pointer;font-family:inherit;}
  .skip:hover{background:#f3ece0;}
  .times{font-size:12px;color:var(--muted);font-family:ui-monospace,Menlo,Consolas,monospace;white-space:nowrap;flex:0 0 auto;}
  #progress{position:relative;flex:1 1 auto;height:22px;cursor:pointer;touch-action:none;}
  #progress .track{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);height:5px;background:#e9e1d3;border-radius:3px;}
  #progress .fill{position:absolute;left:0;top:50%;transform:translateY(-50%);height:5px;background:var(--accent);border-radius:3px;width:0%;}
  #progress .thumb{position:absolute;top:50%;left:0%;transform:translate(-50%,-50%);width:13px;height:13px;background:#fff;border:2px solid var(--accent);border-radius:50%;pointer-events:none;}

  /* 侧栏 */
  .side-title{font-size:13px;font-weight:700;color:#7a4a3f;}
  .side-hint{font-size:11px;color:var(--muted);line-height:1.5;}
  .spk-list{flex:1 1 auto;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:6px;}
  .spk-row{display:flex;align-items:center;gap:5px;}
  .spk-lab{flex:0 0 52px;font-size:11.5px;color:var(--muted);}
  .spk-input{flex:1 1 auto;font-family:inherit;font-size:12px;padding:4px 6px;border:1px solid var(--line);border-radius:5px;background:#fff;min-width:0;}
  .spk-input:focus{outline:none;border-color:var(--accent);}
  .mini{flex:0 0 auto;border:1px solid var(--line);background:#fffdf8;color:#6b5c48;border-radius:5px;padding:3px 6px;font-size:11px;cursor:pointer;font-family:inherit;}
  .mini:hover{background:#f3ece0;}
  .mini.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .brush-state{display:none;font-size:11.5px;color:var(--accent);}
  .brush-state.show{display:block;}

  /* 浮层 */
  .ctx{position:fixed;z-index:60;min-width:92px;background:#fffdf8;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(60,45,30,.18);padding:4px;display:none;}
  .ctx.open{display:block;}
  .ctx button{display:block;width:100%;text-align:left;border:none;background:transparent;font-family:inherit;font-size:13px;color:var(--ink);padding:7px 10px;border-radius:5px;cursor:pointer;}
  .ctx button:hover{background:#f3ece0;}
  .ctx button.danger{color:var(--accent);}
  .batchbar{position:fixed;left:calc(50% - 131px);bottom:82px;transform:translateX(-50%);display:none;align-items:center;gap:8px;background:#2c2a26;color:#fff;padding:7px 10px 7px 14px;border-radius:22px;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:50;font-size:12px;pointer-events:none;}
  .batchbar.show{display:flex;}
  .batchbar button{border:none;border-radius:16px;padding:5px 10px;font-family:inherit;font-size:12px;cursor:pointer;pointer-events:auto;}
  #batchConfirm{background:var(--accent);color:#fff;}
  #batchConfirm:disabled{opacity:.45;cursor:default;}
  #batchCancel{background:#4a463f;color:#fff;}
  audio{display:none;}
  .hist-block{margin-top:12px; text-align:left;}
  .hist-toggle{border:none; background:transparent; color:var(--muted); font-family:inherit; font-size:12px; cursor:pointer; text-decoration:underline; padding:0;}
  .hist-toggle:hover{color:var(--accent);}
  .hist-panel{margin-top:8px; max-height:210px; overflow:auto; background:#fffdf8; border:1px solid var(--line); border-radius:10px; padding:6px;}
  .hist-panel.hidden{display:none;}
  .hist-item{padding:7px 8px; border-radius:6px; cursor:pointer; font-size:12px; color:#4a443b; display:flex; flex-direction:column; gap:2px;}
  .hist-item:hover{background:#f3ece0;}
  .hist-item small{color:var(--muted); font-size:10.5px;}
  @media (max-width:820px){
    aside{width:200px;flex-basis:200px;}
    main{padding:10px 12px 22px;} header{padding:10px 12px 6px;} footer{padding:8px 12px 10px;}
    .head-row{flex-direction:column;gap:6px;} .tools{justify-content:flex-start;}
  }
</style>
</head>
<body>

<!-- 首页 -->
<div id="landing">
  <div class="landing-glow"></div>
  <div class="landing-card">
    <div class="logo-wrap">
      <div class="logo-mark">
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M10 32h6M18 24v16M26 18v28M34 26v12M42 20v24M50 28v8" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="brand-block">
        <div class="brand">iFlyProof</div>
        <div class="brand-sub">转写校对工作台</div>
      </div>
    </div>
    <h2 class="landing-title">粘贴讯飞听见分享链接，进入可编辑转写稿</h2>
    <div class="paste-box">
      <input id="shareUrl" placeholder="https://shareaudio.iflyrec.com/appShare/share.html?audioId=..." autocomplete="off">
      <button id="parseBtn">解析并打开</button>
      <button id="addLinkBtn" type="button" class="plus" title="添加链接（最多 3 个）">＋</button>
    </div>
    <div id="extraLinks"></div>
    <div id="parseMsg" class="msg"></div>
    <div class="landing-links">
      <button id="histBtn" class="link-btn" type="button" title="查看最近 10 个分享链接">历史链接</button>
      <button id="openProjLandingBtn" class="link-btn" type="button" title="打开 .trp 项目文件">打开项目</button>
      <span id="continueRow" class="hidden"><button id="continueBtn" class="link-btn" type="button" title="恢复上次编辑">继续编辑</button></span>
    </div>
    <div id="histPanel" class="hist-panel hidden">
      <div id="histList"></div>
    </div>
    <div class="landing-foot">本地工作台 · 转写与音频只保存在你的浏览器</div>
  </div>
</div>

<!-- 编辑界面 -->
<div id="editor" class="hidden">
  <div class="col">
    <header>
      <div class="head-row">
        <div>
          <h1 class="doc" id="docTitle">未命名</h1>
          <div class="doc-sub" id="docSub"></div>
        </div>
        <div class="tools">
          <label class="ghost">倍速
            <select id="rate" style="border:none;background:transparent;font-family:inherit;font-size:12px;">
              <option value="0.75">0.75×</option>
              <option value="1" selected>1×</option>
              <option value="1.25">1.25×</option>
              <option value="1.5">1.5×</option>
              <option value="2">2×</option>
            </select>
          </label>
          <button id="splitBtn" class="ghost" type="button">分段</button>
          <button id="undoBtn" class="ghost" type="button" title="撤销 (Ctrl/⌘+Z)">撤销</button>
          <button id="saveProjBtn" class="ghost" type="button">保存项目</button>
          <button id="openProjBtn" class="ghost" type="button">打开项目</button>
          <input id="projFile" type="file" accept=".trp,application/octet-stream" hidden>
          <button id="diarBtn" class="ghost" type="button">自动分说话人</button>
          <button id="exportBtn" class="ghost" type="button">导出文本</button>
          <button id="reimportBtn" class="ghost" type="button">返回首页</button>
        </div>
      </div>
      <div id="splitHint">分段模式：在任意一句话里选中文字，松手后即从选区起点拆成两句。</div>
    </header>
    <main id="list"></main>
    <footer>
      <div class="now" id="now">准备就绪。</div>
      <div class="controls">
        <button id="back5" class="skip" type="button">−5s</button>
        <button id="playBtn" type="button">▶</button>
        <button id="fwd5" class="skip" type="button">+5s</button>
        <span class="times"><span id="cur">00:00:00</span> / <span id="dur">--:--:--</span></span>
        <div id="progress"><div class="track"></div><div class="fill" id="fill"></div><div class="thumb" id="thumb"></div></div>
      </div>
      <audio id="audio" preload="metadata"></audio>
    </footer>
  </div>
  <aside>
    <div class="side-title">说话人对照</div>
    <div class="side-hint">改名字后全文实时同步；「替换」可合并/改名，「刷」后拖选可刷一片发言人。</div>
    <div id="spkList" class="spk-list"></div>
    <div id="brushState" class="brush-state"></div>
    <div><button id="refreshSpkBtn" class="ghost" type="button">刷新说话人</button> <button id="clearBtn" class="ghost" type="button">恢复到讯飞原有版本</button></div>
  </aside>
</div>

<div id="ctxMenu" class="ctx">
  <button type="button" data-act="copySel" id="ctxCopySel">复制所选</button>
  <button type="button" data-act="copyOne">复制本行</button>
  <button type="button" data-act="edit">编辑文字</button>
  <button type="button" data-act="editSpk">编辑发言人</button>
  <button type="button" data-act="delete" class="danger">删除</button>
</div>
<div id="batchBar" class="batchbar">
  <span id="batchCount">已选 0 条</span>
  <button id="batchCopyAll" type="button">复制所有信息</button>
  <button id="batchCopyText" type="button">仅复制内容</button>
  <button id="batchConfirm" type="button">删除 0 项</button>
  <button id="batchCancel" type="button">取消</button>
</div>

<script>
(function(){
  'use strict';
  const $ = id => document.getElementById(id);
  const landing = $('landing'), editor = $('editor');
  const listEl = $('list'), audio = $('audio');
  const playBtn = $('playBtn'), back5 = $('back5'), fwd5 = $('fwd5');
  const curEl = $('cur'), durEl = $('dur'), fillEl = $('fill'), thumbEl = $('thumb');
  const progressEl = $('progress'), nowEl = $('now'), rateEl = $('rate');
  const spkList = $('spkList'), brushState = $('brushState');
  const splitBtn = $('splitBtn'), splitHint = $('splitHint');
  const batchBar = $('batchBar');
  const batchCount = $('batchCount'), batchConfirm = $('batchConfirm'), batchCancel = $('batchCancel');
  const ctxMenu = $('ctxMenu');
  const docTitle = $('docTitle'), docSub = $('docSub');

  const LS = 'dsh_workbench_v1';
  let S = { title:'', url:'', audioUrl:'', audioId:'', duration:0, items:[], names:{} };
  let utts = [], activeIdx = -1, DURATION = 0;
  let dirty = false;

  // ---------- 撤销 ----------
  const undoStack = [];
  function snapState(){ return JSON.stringify({items:S.items, names:S.names}); }
  function pushUndo(){
    undoStack.push(snapState());
    if (undoStack.length > 80) undoStack.shift();
  }
  function undo(){
    if (!undoStack.length) return;
    const s = JSON.parse(undoStack.pop());
    S.items = s.items;
    S.names = s.names;
    save();
    renderAll();
    if (utts[activeIdx]) updateNow(activeIdx);
  }
  function isTyping(){
    const ae = document.activeElement;
    return !!(ae && (ae.isContentEditable || ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA'));
  }

  // ---------- 工具 ----------
  function fmt(sec){
    if (!isFinite(sec) || sec < 0) sec = 0;
    sec = Math.floor(sec);
    return String(Math.floor(sec/3600)).padStart(2,'0') + ':' +
           String(Math.floor((sec%3600)/60)).padStart(2,'0') + ':' +
           String(sec%60).padStart(2,'0');
  }
  function nameOf(spk){ return S.names[spk] || ('说话人' + spk); }
  function displayName(it){ return it.name || nameOf(it.spk); }
  function save(){ try { localStorage.setItem(LS, JSON.stringify(S)); } catch(e){} dirty = true; scheduleDocSave(); }

  // ---------- 按链接保存历史文档，命中时免重复解析 ----------
  const DOCKEY = 'dsh_workbench_docs_v1';
  let docTimer = null;
  function docKey(st){
    if (!st) return '';
    if (st.urls && st.urls.length) return st.urls.join('|');
    return st.audioId || st.url || '';
  }
  function scheduleDocSave(){
    if (docTimer) clearTimeout(docTimer);
    docTimer = setTimeout(saveDoc, 600);
  }
  function saveDoc(){
    try {
      const key = docKey(S);
      if (!key || !S.items || !S.items.length) return;
      let docs = {};
      try { docs = JSON.parse(localStorage.getItem(DOCKEY) || '{}') || {}; } catch(e){}
      docs[key] = { savedAt: Date.now(), title: S.title || '', state: S };
      const keys = Object.keys(docs).sort(function(a,b){ return (docs[b].savedAt||0)-(docs[a].savedAt||0); });
      keys.slice(5).forEach(function(k){ delete docs[k]; });
      localStorage.setItem(DOCKEY, JSON.stringify(docs));
    } catch(e){}
  }
  function loadDocByUrl(url){
    const m = url.match(/[?&]audioId=([A-Za-z0-9]+)/);
    const audioId = m ? m[1] : '';
    let docs = {};
    try { docs = JSON.parse(localStorage.getItem(DOCKEY) || '{}') || {}; } catch(e){}
    if (docs[url]) return docs[url];
    if (audioId && docs[audioId]) return docs[audioId];
    return null;
  }
  function inHistory(url){
    try { return loadHistory().some(function(x){ return x.url === url || x.audioId === (url.match(/[?&]audioId=([A-Za-z0-9]+)/)||[])[1]; }); } catch(e){ return false; }
  }

  // ---------- 渲染 ----------
  function makeRow(it){
    const row = document.createElement('div');
    row.className = 'entry';
    row.dataset.t = it.t;
    const tEl = document.createElement('span'); tEl.className='time'; tEl.textContent = it.time || fmt(it.t);
    const sEl = document.createElement('span'); sEl.className='spk'; sEl.textContent = displayName(it);
    const xEl = document.createElement('span'); xEl.className='txt'; xEl.textContent = it.text;
    const eBtn = document.createElement('button'); eBtn.className='edit'; eBtn.type='button'; eBtn.textContent='✎';
    row.append(tEl, sEl, xEl, eBtn);
    const u = { t: it.t, el: row, it: it, spkEl: sEl, txtEl: xEl };
    row._u = u;

    row.addEventListener('click', function(e){
      if (suppressClick){ suppressClick = false; return; }

      if (splitArmed || brushNum !== null) return;
      const cx = e.clientX, cy = e.clientY;
      const onText = !!e.target.closest('.txt');
      if (clickTimer){ clearTimeout(clickTimer); clickTimer = null; return; }
      clickTimer = setTimeout(function(){
        clickTimer = null;
        let target = it.t;
        if (onText){
          let range = null;
          if (document.caretRangeFromPoint) range = document.caretRangeFromPoint(cx, cy);
          else if (document.caretPositionFromPoint){
            const p = document.caretPositionFromPoint(cx, cy);
            if (p){ range = document.createRange(); range.setStart(p.offsetNode, p.offset); range.collapse(true); }
          }
          if (range && xEl.contains(range.startContainer)){
            const pre = document.createRange();
            pre.selectNodeContents(xEl);
            pre.setEnd(range.startContainer, range.startOffset);
            const off = pre.toString().length;
            const total = (xEl.textContent || '').length || 1;
            const idx = utts.findIndex(function(x){ return x.it === it; });
            const nextT = (idx >= 0 && utts[idx + 1]) ? utts[idx + 1].t : DURATION;

            target = it.t + span * Math.min(1, off / total) - 1; // 该字前 1 秒

      if (e.target.closest('.edit')) return;

  // ---------- 播放同步 ----------
  function findIndex(t){

  // ---------- 编辑文字 ----------
  function setCaretAtOffset(el, offset){
    let remaining = offset;
    const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
    let node;
    while ((node = walker.nextNode())){
      const len = node.nodeValue.length;
      if (remaining <= len){
        const r = document.createRange();
        r.setStart(node, remaining);
        r.collapse(true);
        const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
        return;
      }
      remaining -= len;
    }
    const r = document.createRange(); r.selectNodeContents(el); r.collapse(false);
    const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
  }
  function placeCaretAtPoint(el, x, y){
    let range = null;
    if (document.caretRangeFromPoint) range = document.caretRangeFromPoint(x, y);
    else if (document.caretPositionFromPoint){
      const p = document.caretPositionFromPoint(x, y);
      if (p){ range = document.createRange(); range.setStart(p.offsetNode, p.offset); range.collapse(true); }
    }
    if (!range || !el.contains(range.startContainer)) return false;
    try {
      const pre = document.createRange();
      pre.selectNodeContents(el);
      pre.setEnd(range.startContainer, range.startOffset);
      let off = pre.toString().length;
      if (off < el.textContent.length) off += 1; // 光标放到该字后面
      setCaretAtOffset(el, off);
      return true;
    } catch(e){ return false; }
  }
  function startEdit(u, pos){
    const row=u.el, xEl=u.txtEl;

    row.dataset.editing='1'; xEl.contentEditable='true'; xEl.classList.add('editing'); xEl.focus();
    if (!(pos && placeCaretAtPoint(xEl, pos.x, pos.y))){
      const r=document.createRange(); r.selectNodeContents(xEl); r.collapse(false);
      const sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
    }
    const onKey=function(ev){
      if (ev.isComposing) return;
      if (ev.key==='Enter' && !ev.shiftKey){ ev.preventDefault(); ev.stopPropagation(); xEl.blur(); }
      else if (ev.key==='Escape'){ ev.preventDefault(); xEl.textContent=orig; xEl.blur(); }
    };
    const onBefore=function(ev){ if (ev.inputType==='insertParagraph'||ev.inputType==='insertLineBreak') ev.preventDefault(); };
    const onInput=function(){ u.it.text = xEl.textContent; save(); };
    xEl.addEventListener('keydown', onKey); xEl.addEventListener('beforeinput', onBefore); xEl.addEventListener('input', onInput);
    xEl.addEventListener('blur', function(){

      let v = xEl.textContent.replace(/\u00a0/g,' ').replace(/[\r\n]+/g,'').trim();
      if (!v) v = orig;
      xEl.textContent = v; u.it.text = v; row.classList.add('edited'); save();
      if (utts[activeIdx]===u) updateNow(activeIdx);
    }, {once:true});
  }

  // ---------- 行内发言人 ----------
  function startSpkEdit(u){

    }
    inp.addEventListener('keydown', function(ev){ if (ev.key==='Enter'){ ev.preventDefault(); commit(true); } else if (ev.key==='Escape'){ commit(false); } });

  let splitArmed=false, suppressClick=false;

  function selectionInfo(){
    const sel=window.getSelection();

    const txt = el && el.closest ? el.closest('.txt') : null;
    if (!txt || !txt.contains(range.endContainer)) return null;

  function offsetIn(txt, c, o){ const r=document.createRange(); r.selectNodeContents(txt); r.setEnd(c,o); return r.toString().length; }

  listEl.addEventListener('mouseup', function(e){
    if (!splitArmed) return;
    const info = selectionInfo(); if (!info) return;
    const txt=info.txt, total=txt.textContent.length;
    let off = offsetIn(txt, info.range.startContainer, info.range.startOffset);
    if (off<=0) off = offsetIn(txt, info.range.endContainer, info.range.endOffset);
    if (off<=0 || off>=total) return;

  function doSplit(u, off){
    const text = u.it.text;
    if (off<=0 || off>=text.length) return;
    const p1 = text.slice(0,off).trim(), p2 = text.slice(off).trim();
    if (!p1 || !p2) return;
    pushUndo();
    const pos = S.items.indexOf(u.it);
    let nextT = DURATION;
    for (let i=pos+1;i<S.items.length;i++){ nextT = S.items[i].t; break; }
    const gap = nextT - u.it.t;
    const est = Math.max(3, text.length*0.45);
    const span = gap>0 ? Math.min(gap, est) : est;
    let t2 = Math.round(u.it.t + span*(off/text.length));
    if (t2<=u.it.t) t2=u.it.t+1;
    if (nextT>u.it.t+1 && t2>=nextT) t2=nextT-1;
    u.it.text = p1; u.txtEl.textContent = p1; u.el.classList.add('edited');
    const newItem = {t:t2, time:fmt(t2), spk:u.it.spk, text:p2};

  // ---------- 批量删除 + 格式刷 ----------
  let brushNum=null, dragKind=null;

  const selectedRows = new Set();

  function deselectRow(r){ if(!r) return; r.classList.remove('selected'); selectedRows.delete(r); }
  function toggleRowSel(r){ if (selectedRows.has(r)) deselectRow(r); else selectRow(r); }
  function clearSelection(){ selectedRows.forEach(function(r){ r.classList.remove('selected'); }); selectedRows.clear(); updateBatchBar(); }
  function updateBatchBar(){

  let lastPX=0, lastPY=0, scrollRAF=null;
  function rowAtPoint(x,y){ const el=document.elementFromPoint(x,y); return el && el.closest ? el.closest('.entry') : null; }
  function updateBatchAt(x,y){
    const row=rowAtPoint(x,y); if(!row) return;
    const idx=dragRows.indexOf(row); if(idx<0) return;
    if (idx!==dragAnchorIdx) dragMoved=true;

  function updateBrushAt(x,y){
    const row=rowAtPoint(x,y); if(!row) return;
    const idx=dragRows.indexOf(row); if(idx<0) return;

    const a=Math.min(dragAnchorIdx,idx), b=Math.max(dragAnchorIdx,idx);

  // ---------- 说话人对照 ----------

  // 刷新说话人：按“当前显示的姓名/别名”重新归并，清掉改名过程中产生的重复、空条目
  function refreshSpeakers(){

  // ---------- 右键菜单 ----------
  let ctxTarget=null;

  function doDelete(u){

  function copyText(text){
    if (!text) return;
    function done(){ nowEl.textContent = '已复制 ' + text.split('\n').length + ' 条'; }
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done).catch(function(){ fallbackCopy(text); });
    } else fallbackCopy(text);
    function fallbackCopy(t){
      const ta = document.createElement('textarea');
      ta.value = t; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch(e){ alert('复制失败'); }
      document.body.removeChild(ta);
    }
  }
  function copyRows(rows, onlyText){
    const list = rows.filter(Boolean).map(function(r){ return r._u; }).filter(Boolean);
    if (!list.length) return;
    list.sort(function(a,b){ return S.items.indexOf(a.it) - S.items.indexOf(b.it); });
    const text = list.map(function(u){

  // IndexedDB：音频缓存
  function idbOpen(){
    return new Promise(function(res, rej){
      const req = indexedDB.open('dsh_workbench_db', 2);
      req.onupgradeneeded = function(e){
        const db = e.target.result;
        if (!db.objectStoreNames.contains('audio')) db.createObjectStore('audio');
        if (!db.objectStoreNames.contains('model')) db.createObjectStore('model');
      };
      req.onsuccess = function(){ res(req.result); };
      req.onerror = function(){ rej(req.error); };
    });
  }
  async function idbGet(store, key){
    if (!key) return null;
    try {
      const db = await idbOpen();
      return await new Promise(function(res, rej){
        const tx = db.transaction(store,'readonly');
        const r = tx.objectStore(store).get(key);
        r.onsuccess = function(){ res(r.result); };
        r.onerror = function(){ rej(r.error); };
      });
    } catch(e){ return null; }
  }
  async function idbPut(store, key, val){
    if (!key) return;
    try {
      const db = await idbOpen();
      await new Promise(function(res, rej){
        const tx = db.transaction(store,'readwrite');
        tx.objectStore(store).put(val, key);
        tx.oncomplete = function(){ res(); };
        tx.onerror = function(){ rej(tx.error); };
      });
    } catch(e){}
  }
  async function fetchBlob(url, onProgress){
    const res = await fetch(url);
    if (!res.ok) throw new Error('音频下载失败 ' + res.status);
    const total = parseInt(res.headers.get('Content-Length')||'0',10);
    const reader = res.body.getReader();
    const chunks = []; let received = 0;
    while (true){
      const r = await reader.read();
      if (r.done) break;
      chunks.push(r.value); received += r.value.length;
      if (onProgress) onProgress(received, total);
    }
    return new Blob(chunks, {type:'audio/mpeg'});
  }

  // ---------- 项目文件：单文件 .trp（zip 容器：state.json + audio.mp3） ----------
  function crc32(buf){
    if (!crc32.t){
      const t = new Uint32Array(256);
      for (let n=0;n<256;n++){ let c=n; for (let k=0;k<8;k++) c = (c&1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1); t[n]=c>>>0; }
      crc32.t = t;
    }
    let crc = 0xFFFFFFFF;
    for (let i=0;i<buf.length;i++) crc = (crc>>>8) ^ crc32.t[(crc ^ buf[i]) & 0xFF];
    return (crc ^ 0xFFFFFFFF) >>> 0;
  }
  function zipCreate(files){
    const enc = new TextEncoder();
    const chunks = [], central = [];
    let offset = 0;
    const d = new Date();
    const time = ((d.getHours()&31)<<11) | ((d.getMinutes()&63)<<5) | (((d.getSeconds()/2)|0)&31);
    const date = (((d.getFullYear()-1980)&127)<<9) | (((d.getMonth()+1)&15)<<5) | (d.getDate()&31);
    files.forEach(function(f){
      const name = enc.encode(f.name);
      const data = f.data;
      const crc = crc32(data);
      const local = new Uint8Array(30 + name.length);
      const lv = new DataView(local.buffer);
      lv.setUint32(0, 0x04034b50, true); lv.setUint16(4, 20, true); lv.setUint16(6, 0, true); lv.setUint16(8, 0, true);
      lv.setUint16(10, time, true); lv.setUint16(12, date, true);
      lv.setUint32(14, crc, true); lv.setUint32(18, data.length, true); lv.setUint32(22, data.length, true);
      lv.setUint16(26, name.length, true); lv.setUint16(28, 0, true);
      local.set(name, 30);
      chunks.push(local, data);
      const cen = new Uint8Array(46 + name.length);
      const cv = new DataView(cen.buffer);
      cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true); cv.setUint16(6, 20, true);
      cv.setUint16(8, 0, true); cv.setUint16(10, 0, true);
      cv.setUint16(12, time, true); cv.setUint16(14, date, true);
      cv.setUint32(16, crc, true); cv.setUint32(20, data.length, true); cv.setUint32(24, data.length, true);
      cv.setUint16(28, name.length, true); cv.setUint16(30, 0, true); cv.setUint16(32, 0, true);
      cv.setUint16(34, 0, true); cv.setUint16(36, 0, true); cv.setUint32(38, 0, true);
      cv.setUint32(42, offset, true);
      cen.set(name, 46);
      central.push(cen);
      offset += local.length + data.length;
    });
    const cdStart = offset;
    let cdSize = 0; central.forEach(function(c){ cdSize += c.length; });
    const eocd = new Uint8Array(22);
    const ev = new DataView(eocd.buffer);
    ev.setUint32(0, 0x06054b50, true); ev.setUint16(4, 0, true); ev.setUint16(6, 0, true);
    ev.setUint16(8, files.length, true); ev.setUint16(10, files.length, true);
    ev.setUint32(12, cdSize, true); ev.setUint32(16, cdStart, true); ev.setUint16(20, 0, true);
    return new Blob(chunks.concat(central, [eocd]), {type:'application/octet-stream'});
  }
  async function zipRead(blob){
    const buf = new Uint8Array(await blob.arrayBuffer());
    const dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
    let eocd = -1;
    const min = Math.max(0, buf.length - 22 - 65535);
    for (let i=buf.length-22; i>=min; i--){
      if (buf[i]===0x50 && buf[i+1]===0x4b && buf[i+2]===0x05 && buf[i+3]===0x06){ eocd=i; break; }
    }
    if (eocd < 0) throw new Error('不是有效的 .trp 项目文件');
    const count = dv.getUint16(eocd+10, true);
    let p = dv.getUint32(eocd+16, true);
    const out = {};
    for (let i=0;i<count;i++){
      if (dv.getUint32(p, true) !== 0x02014b50) break;
      const compSize = dv.getUint32(p+20, true);
      const nameLen = dv.getUint16(p+28, true);
      const extraLen = dv.getUint16(p+30, true);
      const commentLen = dv.getUint16(p+32, true);
      const localOff = dv.getUint32(p+42, true);
      const name = new TextDecoder().decode(buf.subarray(p+46, p+46+nameLen));
      const lNameLen = dv.getUint16(localOff+26, true);
      const lExtraLen = dv.getUint16(localOff+28, true);
      const dataStart = localOff + 30 + lNameLen + lExtraLen;
      out[name] = buf.subarray(dataStart, dataStart + compSize);
      p += 46 + nameLen + extraLen + commentLen;
    }
    return out;
  }

    try {
      $('diarBtn').disabled = true;
      nowEl.textContent = '本地分离中…（可能要几分钟，请稍候）';
      const body = { url: S.audioUrl || '', duration: S.duration || 0, numSpeakers: k };
      if (minutes > 0) body.maxSeconds = minutes * 60;
      const res = await fetch('/api/diarize', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(body)
      });
      const d = await res.json();
      if (!d.ok) throw new Error(d.error || '分离失败');
      const segs = d.segments || [];
      const names = {};
      S.items.forEach(function(it, idx){
        const st = it.t;
        const en = (S.items[idx + 1] ? S.items[idx + 1].t : st + 30);
        let best = null, bestOv = 0;
        segs.forEach(function(sg){
          const ov = Math.min(en, sg.end) - Math.max(st, sg.start);
          if (ov > bestOv){ bestOv = ov; best = sg; }
        });
        if (best && bestOv > 0){
          const key = 'D' + (best.spk + 1);
          it.spk = key;
          delete it.name;
          names[key] = '说话人' + (best.spk + 1);
        }
      });
      Object.keys(names).forEach(function(nm){ S.names[nm] = names[nm]; });
      save(); renderAll();
      nowEl.textContent = '自动分说话人完成：' + k + ' 位，共 ' + segs.length + ' 段。';
    } catch(e){
      alert('自动分说话人失败：' + (e.message || e));
      nowEl.textContent = '';
    } finally {
      $('diarBtn').disabled = false;
    }
  }
  if ($('diarBtn')) $('diarBtn').addEventListener('click', autoDiarize);

  window.DSH = {
    getState: function(){ return JSON.parse(JSON.stringify(S)); },
    importShare: function(url){ return doImport(url); },
    renameSpeaker: function(spk, name){ S.names[spk]=name; save(); buildSpkPanel(); utts.forEach(function(u){ if (u.it.spk===spk && !u.it.name) u.spkEl.textContent=name; }); },
    replaceSpeaker: function(from, to){ S.items.forEach(function(it){ if (String(it.spk)===String(from)){ it.spk=String(to); delete it.name; } }); delete S.names[from]; save(); renderAll(); },
    setText: function(idx, text){ if (S.items[idx]){ S.items[idx].text=text; save(); renderAll(); } },
    deleteItems: function(idxs){ idxs.slice().sort(function(a,b){return b-a;}).forEach(function(i){ if (S.items[i]) S.items.splice(i,1); }); save(); renderAll(); },
    exportText: function(){ return S.items.map(function(it){ return '['+it.time+'] '+displayName(it)+'：'+it.text; }).join('\n'); },
    seek: function(t){ jumpTo(t, true); }
  };
})();
</script>
</body>
</html>
